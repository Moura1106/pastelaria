{% extends "base.html" %}
{% from "_macros.html" import campo %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="login">
  <h1>Caixa da Pastelaria</h1>
  <form method="post" class="cartao">
    {{ form.hidden_tag() }}
    {{ campo(form.email) }}
    {{ campo(form.senha) }}
    {{ campo(form.lembrar) }}
    <button type="submit" class="btn btn-largo">Entrar</button>
  </form>
</div>
{% endblock %}
